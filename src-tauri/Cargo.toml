[package]
name = "kairos"
version = "0.1.0"
description = "A high-performance prediction market strategy engine. Aggregates news, analyzes sentiment via LLMs, and calculates expected value for Polymarket positions using local vector embeddings and probabilistic models. Built with Rust and Tauri. "
authors = ["Arjol Panci"]
edition = "2021"

[lib]
name = "kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "1.4"

# AI (Stable, Pure Rust)
async-openai = "0.23.3"
dotenvy = "0.15"

serde-aux = "4.5"
